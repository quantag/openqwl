[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openqwl"
version = "0.1.0"
description = "Reference interpreter for the OpenQWL workflow format"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
qiskit = ["qiskit>=1.0"]

[project.scripts]
openqwl = "openqwl.cli:main"

[tool.setuptools.packages.find]
include = ["openqwl*"]
